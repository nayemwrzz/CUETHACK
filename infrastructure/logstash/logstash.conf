input {
  # Accept logs via TCP (services will send logs here)
  tcp {
    port => 5044
    codec => json_lines
  }
  
  # Accept logs via HTTP
  http {
    port => 8080
    codec => json
  }
  
  # Note: External port is 8081, but internal port is still 8080
}

filter {
  # Parse JSON logs
  if [message] {
    json {
      source => "message"
      target => "parsed"
    }
  }
  
  # Extract service name
  if [service] {
    mutate {
      add_field => { "service_name" => "%{service}" }
    }
  }
  
  # Parse timestamp
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
    }
  } else {
    date {
      match => [ "@timestamp", "ISO8601" ]
    }
  }
  
  # Add environment
  mutate {
    add_field => { "environment" => "development" }
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "careforall-logs-%{+YYYY.MM.dd}"
  }
  
  # Debug output
  stdout {
    codec => rubydebug
  }
}

